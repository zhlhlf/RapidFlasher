name: build-arm64

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TARGET: aarch64-linux-android
  API: 21

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust target
        run: |
          rustup toolchain install stable --profile minimal --target "$TARGET"
          rustup default stable
          rustc --version

      - name: Locate Android NDK
        id: ndk
        run: |
          set -euo pipefail
          for base in "$ANDROID_NDK_LATEST_HOME" "$ANDROID_NDK_HOME" "$ANDROID_NDK_ROOT" \
                      /usr/local/lib/android/sdk/ndk/*; do
            [ -n "${base:-}" ] || continue
            [ -d "$base/toolchains/llvm/prebuilt/linux-x86_64/bin" ] || continue
            echo "ndk=$base" >> "$GITHUB_OUTPUT"
            echo "using NDK: $base"
            exit 0
          done
          echo "no NDK found" >&2
          exit 1

      - name: Build
        env:
          NDK: ${{ steps.ndk.outputs.ndk }}
        run: |
          set -euo pipefail
          BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$BIN/aarch64-linux-android${API}-clang"
          export AR_aarch64_linux_android="$BIN/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$CC_aarch64_linux_android"
          cargo build --release --target "$TARGET" --locked
          ls -lh "target/$TARGET/release/update-binary"
          file "target/$TARGET/release/update-binary"

      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/$TARGET/release/update-binary" dist/
          (cd dist && sha256sum update-binary > update-binary.sha256)
          cat dist/update-binary.sha256
          bash package.sh "target/$TARGET/release/update-binary" dist "${GITHUB_SHA:0:8}"
          ls -l dist

      - name: Resolve release name
        id: rel
        run: echo "name=${GITHUB_SHA:0:8}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: update-binary-arm64
          path: dist/*
          if-no-files-found: error

      - name: Release (manual run)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.rel.outputs.name }}
        run: |
          set -euo pipefail
          {
            printf 'Manual build of %s on %s.\n\n' "$GITHUB_SHA" "$GITHUB_REF_NAME"
            printf '```\n'
            cat dist/update-binary.sha256
            printf '```\n'
          } > notes.md
          cat notes.md
          if gh release view "$NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $NAME exists, updating"
            gh release edit "$NAME" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
            gh release upload "$NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$NAME" \
              --notes-file notes.md
          fi
          gh release view "$NAME" --repo "$GITHUB_REPOSITORY" --json tagName,name,url --jq '"tag=\(.tagName) name=\(.name) \(.url)"'

      - name: Release (tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
